# Safety layer of teleoperation: nav2 collision_monitor and teleop_safety.
# Velocity commands of the teleop go through teleop_safety and collision_monitor:
#   teleop -> /robotino/cmd_vel_teleop -> teleop_safety -> /robotino/cmd_vel_safe
#   -> collision_monitor -> /robotino/cmd_vel
# Robotino 3 and 4 are circles of radius 0.225 m around base_link.
#
# IR sources have source_timeout 0.0: an IR sensor reports a range out of its span
# when it sees nothing, and collision_monitor would stop the robot treating it as an invalid source.
# The laser keeps the default timeout: without laser scans the robot is stopped.

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/robotino/cmd_vel_safe"
    cmd_vel_out_topic: "/robotino/cmd_vel"
    enable_stamped_cmd_vel: false
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: ["StopZone", "SlowZone"]
    # Zones are velocity polygons of the omnidirectional robot, their shapes are generated by
    # teleop_safety_launch.py from the robot radius and its stop_distance and slow_distance
    # arguments: a polygon is selected by the direction of the commanded velocity and covers only
    # obstacles ahead, so the robot can always move away from an obstacle or along a wall.
    # Rotation in place is never limited: the round robot does not hit anything.
    StopZone:
      type: "velocity_polygon"
      action_type: "stop"
      holonomic: true
      min_points: 3
      visualize: true
      polygon_pub_topic: "/collision_monitor/stop_zone"
      enabled: true
    SlowZone:
      type: "velocity_polygon"
      action_type: "limit"
      linear_limit: 0.2
      angular_limit: 0.6
      holonomic: true
      min_points: 3
      visualize: true
      polygon_pub_topic: "/collision_monitor/slow_zone"
      enabled: true
    observation_sources: ["laser", "ir0", "ir1", "ir2", "ir3", "ir4", "ir5", "ir6", "ir7", "ir8"]
    laser:
      type: "scan"
      topic: "/laser_scan"
      enabled: true
      exclusion_zones: ["robot_body"]
    # The edges of the laser field of view hit the robot itself: ignore laser points closer
    # than 1 cm to the footprint
    robot_body:
      type: "circle"
      radius: 0.235
      frame_id: "base_link"
      enabled: true
    ir0:
      type: "range"
      topic: "/robotino/ir0"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true
    ir1:
      type: "range"
      topic: "/robotino/ir1"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true
    ir2:
      type: "range"
      topic: "/robotino/ir2"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true
    ir3:
      type: "range"
      topic: "/robotino/ir3"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true
    ir4:
      type: "range"
      topic: "/robotino/ir4"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true
    ir5:
      type: "range"
      topic: "/robotino/ir5"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true
    ir6:
      type: "range"
      topic: "/robotino/ir6"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true
    ir7:
      type: "range"
      topic: "/robotino/ir7"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true
    ir8:
      type: "range"
      topic: "/robotino/ir8"
      obstacles_angle: 0.05
      source_timeout: 0.0
      enabled: true

teleop_safety:
  ros__parameters:
    # Hold the reset buttons of the gamepad (reset_estop in joy_teleop.yaml) for this time [s]
    reset_hold_time: 1.0
    # Allow only backward motion while a roller lever switch of the gripper is pressed
    # (/robotino/gripper/contact of the gripper node, see gripper.yaml)
    backward_only_on_contact: true
    # /robotino/safety/motion_blocked is reset if no blocked command comes within this time [s]
    motion_blocked_timeout: 0.5

lifecycle_manager_teleop_safety:
  ros__parameters:
    autostart: true
    node_names: [collision_monitor]
