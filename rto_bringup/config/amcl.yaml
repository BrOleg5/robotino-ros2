# AMCL localization in an occupancy grid map for Robotino:
# Hokuyo URG-04LX-UG01 (240 deg, guaranteed range 0.02..4 m, 10 Hz) on /laser_scan
# and wheel odometry odom -> base_link.
# The map file is set by amcl_launch.py from its map argument.
map_server:
  ros__parameters:
    topic_name: map
    frame_id: map

amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /laser_scan
    map_topic: map
    tf_broadcast: true
    transform_tolerance: 0.5

    # Omnidirectional base: alpha5 is the noise of the sideways motion
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.2  # rotation noise from rotation
    alpha2: 0.2  # rotation noise from translation
    alpha3: 0.2  # translation noise from translation
    alpha4: 0.2  # translation noise from rotation
    alpha5: 0.2  # sideways translation noise

    laser_model_type: likelihood_field
    laser_min_range: 0.02
    laser_max_range: 4.0  # the guaranteed URG-04LX range
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Filter update after the robot moves 0.1 m or 0.1 rad
    update_min_d: 0.1
    update_min_a: 0.1

    # The robot is expected to start at the map origin, otherwise use "2D Pose Estimate" in RViz
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names: [map_server, amcl]
